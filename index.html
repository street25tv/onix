<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ÓNIX Capital · Créditos</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --bg2:#121215; --card:#17171c; --card2:#1e1e24; --line:#2a2a32;
  --gold:#c9a961; --gold2:#e6cf94; --goldDim:rgba(201,169,97,.14);
  --txt:#f1ede4; --mut:#9b978e; --ok:#4fbf8b; --okDim:rgba(79,191,139,.14);
  --warn:#e3b04b; --warnDim:rgba(227,176,75,.14); --bad:#e0645c; --badDim:rgba(224,100,92,.14);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,rgba(201,169,97,.10),transparent 70%),var(--bg)}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
.narrow{max-width:560px}
/* Marca */
.brand{display:flex;align-items:center;gap:12px}
.gem{width:38px;height:38px;flex:none}
.brand b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;letter-spacing:.18em;color:var(--txt)}
.brand b span{color:var(--gold)}
.brand b{white-space:nowrap}
.brand small{white-space:nowrap;display:block;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--mut);margin-top:-2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:0;background:rgba(11,11,13,.92);backdrop-filter:blur(10px);z-index:20}
header.top{flex-wrap:wrap}
@media(max-width:520px){.brand b{font-size:19px;letter-spacing:.12em}.brand small{font-size:9px;letter-spacing:.2em}.gem{width:32px;height:32px}header.top .row{flex-wrap:nowrap}}
/* Tarjetas */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g2.st,.g3.st{grid-template-columns:1fr}}
.kpi{padding:16px}
.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.gold .v{color:var(--gold2)}
/* Formularios */
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px;letter-spacing:.03em}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 13px;font:inherit;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=range]{padding:0;height:6px;accent-color:var(--gold);background:transparent;border:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#141210;font-weight:700;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.dark{background:var(--card2);border-color:var(--line);color:var(--txt)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#06140d}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.tabs button{flex:none;background:transparent;border:1px solid var(--line);color:var(--mut);padding:9px 15px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--goldDim);border-color:var(--gold);color:var(--gold2)}
.tabs .cnt{background:var(--gold);color:#111;border-radius:999px;padding:0 7px;font-size:11px;margin-left:6px;font-weight:700}
/* Tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:11px 12px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.025)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Chips */
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okDim);color:var(--ok)}.c-warn{background:var(--warnDim);color:var(--warn)}
.c-bad{background:var(--badDim);color:var(--bad)}.c-gold{background:var(--goldDim);color:var(--gold2)}
.c-mut{background:rgba(255,255,255,.06);color:var(--mut)}
.mut{color:var(--mut)}.small{font-size:12.5px}.right{text-align:right}.mt{margin-top:14px}.mb{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.big{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:700;color:var(--gold2);line-height:1.05}
.serif{font-family:'Cormorant Garamond',serif}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
/* Modal y toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media(min-width:700px){.ov{align-items:center;padding:20px}}
.md{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:20px}
@media(min-width:700px){.md{border-radius:20px}}
.md h2{font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:4px}
.x{float:right;background:none;border:none;color:var(--mut);font-size:26px;cursor:pointer;line-height:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);color:var(--txt);padding:12px 18px;border-radius:12px;z-index:99;display:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--bad)}
.load{display:flex;justify-content:center;padding:50px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:30px;text-align:center;color:var(--mut)}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .brand{justify-content:center;margin-bottom:26px}
.pin{letter-spacing:.6em;text-align:center;font-size:22px}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.item.alert{border-left:3px solid var(--bad)}.item.due{border-left:3px solid var(--warn)}.item.okk{border-left:3px solid var(--ok)}
.score{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.sc-verde{background:var(--okDim);color:var(--ok);border:2px solid var(--ok)}
.sc-amarillo{background:var(--warnDim);color:var(--warn);border:2px solid var(--warn)}
.refires{background:radial-gradient(400px 160px at 50% 0,rgba(201,169,97,.16),transparent),var(--bg);border:1px solid var(--gold);border-radius:16px;padding:16px;text-align:center;margin-top:14px}
.chip.c-refi{background:rgba(120,150,255,.14);color:#9fb4ff}
.sc-rojo{background:var(--badDim);color:var(--bad);border:2px solid var(--bad)}
</style>

<style>
.hero{text-align:center;padding:26px 0 10px}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1.05;font-weight:700}
.hero h1 em{color:var(--gold2);font-style:italic}
.hero p{color:var(--mut);margin-top:8px}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pills button{background:var(--bg);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px 4px;font:inherit;font-size:13px;cursor:pointer}
.pills button.on{border-color:var(--gold);color:var(--gold2);background:var(--goldDim)}
.res{background:radial-gradient(400px 160px at 50% 0,rgba(201,169,97,.16),transparent),var(--bg);border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center;margin-top:16px}
.res .k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;font-size:12px;color:var(--mut)}
.res .k b{display:block;color:var(--txt);font-size:15px;margin-top:2px}
.mval{font-size:30px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.fab{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--mut);text-align:center}
.steps b{display:block;color:var(--gold2);font-family:'Cormorant Garamond',serif;font-size:24px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media(max-width:520px){.docs{grid-template-columns:1fr}}
.doc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:0;padding:14px 8px;border:1px dashed var(--line);border-radius:14px;background:var(--bg);cursor:pointer;text-align:center;min-height:130px;color:var(--txt);font-size:13px}
.doc input{display:none}
.doc .ph{font-size:30px;line-height:1}
.doc .ph img{width:100%;max-width:140px;max-height:90px;object-fit:cover;border-radius:8px}
.doc small{color:var(--mut);font-size:11.5px}
.doc.ok{border:1px solid var(--ok)}
.doc.ok small{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap narrow">
  <header class="top"><div id="brand"></div><div class="tabs" style="margin:0"><button id="t1" class="on" onclick="ver('sim')">Simular</button><button id="t2" onclick="ver('mi')">Mi crédito</button></div></header>
  <div id="app"></div>
</div>
<a class="fab" id="fab" target="_blank" title="WhatsApp"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg></a>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const money = v => '$' + Math.round(Number(v) || 0).toLocaleString('es-CO');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEM = '<svg class="gem" viewBox="0 0 40 40"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6cf94"/><stop offset="1" stop-color="#9c7d3c"/></linearGradient></defs><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#121215" stroke="url(#gg)" stroke-width="1.6"/><polygon points="20,9 29,14 29,26 20,31 11,26 11,14" fill="none" stroke="url(#gg)" stroke-width="1" opacity=".55"/><polygon points="20,9 29,14 20,20 11,14" fill="url(#gg)" opacity=".85"/></svg>';
function brandHTML(nombre, sub) {
  const n = String(nombre || 'ÓNIX Capital').split(' ');
  return '<div class="brand">' + GEM + '<div><b>' + esc(n[0].toUpperCase()) + (n.length > 1 ? ' <span>' + esc(n.slice(1).join(' ').toUpperCase()) + '</span>' : '') + '</b><small>' + esc(sub || '') + '</small></div></div>';
}
const API_URL = 'https://script.google.com/macros/s/AKfycbyeZ1O-2ma_xIF82IF8FTgH7N6uj3y97PY2pDFQhWkrj-qBA-tZ4d7C7op2BLyL_cvyUA/exec';
const BASE_URL = location.href.split('?')[0].replace(/[^/]*$/, '');
async function api(fn, ...args) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
    j = await r.json();
  } catch (e) { throw new Error('Sin conexión con el servidor. Intenta de nuevo.'); }
  if (!j.ok) {
    const m = j.error || 'Error';
    if (m.indexOf('SESION') >= 0 && window.onSesionExpirada) window.onSesionExpirada();
    throw new Error(m.replace(/^.*SESION:\s*/, ''));
  }
  return j.data;
}
let _tt;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(_tt); _tt = setTimeout(() => t.style.display = 'none', 3800);
}
function modal(html) {
  cerrarModal();
  const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov';
  o.innerHTML = '<div class="md"><button class="x" onclick="cerrarModal()">×</button>' + html + '</div>';
  o.addEventListener('click', e => { if (e.target === o) cerrarModal(); });
  document.body.appendChild(o);
}
function cerrarModal() { const o = $('#ov'); if (o) o.remove(); }
const LOADING = '<div class="load"><div class="spin"></div></div>';
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
async function conBoton(btn, fn) {
  const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:16px;height:16px;border-width:2px"></span>';
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.innerHTML = t; }
}
function chipSit(s, atraso) {
  if (s === 'En mora') return '<span class="chip c-bad">Mora ' + atraso + 'd</span>';
  if (s === 'Al día') return '<span class="chip c-ok">Al día</span>';
  if (s === 'Pagado') return '<span class="chip c-gold">Pagado</span>';
  if (s === 'Refinanciado') return '<span class="chip c-refi">Refinanciado</span>';
  return '<span class="chip c-mut">' + esc(s) + '</span>';
}
function chipCuota(q, hoy) {
  if (q.estado === 'Pagada') return '<span class="chip c-ok">Pagada</span>';
  if (q.estado === 'Refinanciada') return '<span class="chip c-refi">Refinanciada</span>';
  if (q.fecha < hoy) return '<span class="chip c-bad">Vencida</span>';
  if (q.estado === 'Parcial') return '<span class="chip c-warn">Parcial</span>';
  if (q.fecha === hoy) return '<span class="chip c-warn">Hoy</span>';
  return '<span class="chip c-mut">Pendiente</span>';
}
function fechaBonita(s) {
  if (!s) return '';
  const d = new Date(s.slice(0, 10) + 'T12:00:00');
  return d.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });
}
function hoyLocal() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function wa(tel, txt) { let t = String(tel || '').replace(/\D/g, ''); if (t.length === 10) t = '57' + t; return 'https://wa.me/' + t + '?text=' + encodeURIComponent(txt || ''); }
const FREC_TXT = { Diaria: 'diaria', Semanal: 'semanal', Quincenal: 'quincenal', Mensual: 'mensual' };
function refiHTML(r) {
  const s = r.simulacion, a = r.actual, b = r.base;
  const dif = a.cuotaMensual - s.cuotaMensual;
  return '<div class="refires"><div class="small mut">Nueva cuota ' + FREC_TXT[s.frecuencia] + '</div><div class="big">' + money(s.cuota) + '</div>' +
    '<div class="small mut">' + s.n + ' cuotas · total ' + money(s.total) + '</div></div>' +
    '<div class="tw mt"><table><thead><tr><th></th><th class="num">Actual</th><th class="num">Refinanciado</th></tr></thead><tbody>' +
    '<tr><td>Saldo</td><td class="num">' + money(a.saldo) + '</td><td class="num"><b>' + money(s.total) + '</b></td></tr>' +
    '<tr><td>Cuota</td><td class="num">' + money(a.valorCuota) + ' ' + FREC_TXT[a.frecuencia] + '</td><td class="num"><b>' + money(s.cuota) + ' ' + FREC_TXT[s.frecuencia] + '</b></td></tr>' +
    '<tr><td>Equivale al mes</td><td class="num">' + money(a.cuotaMensual) + '</td><td class="num"><b>' + money(s.cuotaMensual) + '</b></td></tr>' +
    '<tr><td>Cuotas por pagar</td><td class="num">' + a.cuotasRestantes + '</td><td class="num"><b>' + s.n + '</b></td></tr>' +
    '<tr><td>Días de atraso</td><td class="num">' + a.diasAtraso + '</td><td class="num"><b>0</b></td></tr></tbody></table></div>' +
    '<div class="small mt" style="line-height:1.85"><b style="color:var(--gold)">Cómo se calcula</b><br>' +
    'Capital pendiente <b>' + money(b.capitalPendiente) + '</b>' +
    (b.capitalizado && b.interesVencido ? ' + interés causado no pagado <b>' + money(b.interesVencido) + '</b>' : '') +
    (b.adicional ? ' + dinero adicional <b>' + money(b.adicional) + '</b>' : '') +
    (b.capitalizado && (b.interesVencido || b.adicional) ? ' = nuevo capital <b>' + money(s.capital) + '</b>' : '') +
    ' → interés ' + s.tasa + '% × ' + s.meses + (s.meses == 1 ? ' mes' : ' meses') + ' = <b>' + money(s.interesNuevo) + '</b><br>' +
    (!b.capitalizado && b.interesVencido ? 'Interés vencido sin pagar (se traslada sin generar más interés): <b>' + money(b.interesVencido) + '</b><br>' : '') +
    (b.comision ? 'Comisión de refinanciación: <b>' + money(b.comision) + '</b><br>' : '') +
    '<span style="color:var(--ok)">Interés futuro que se descuenta: <b>' + money(b.interesCondonado) + '</b></span><br>' +
    (dif > 0 ? '<span style="color:var(--ok)">La cuota mensual baja ' + money(dif) + ' (' + Math.round(dif / (a.cuotaMensual || 1) * 100) + '%)</span>'
             : '<span style="color:var(--warn)">La cuota mensual sube ' + money(-dif) + '</span>') + '</div>';
}
function comprimirImagen(file, max = 1600, q = 0.82) {
  return new Promise((ok, ko) => {
    if (!/^image\//.test(file.type || 'image/')) return ko(new Error('El archivo debe ser una imagen'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', q).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('No se pudo leer la imagen. Intenta con otra foto.')); };
    img.src = url;
  });
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function tablaCuotas(cuotas, hoy) {
  return '<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>#</th><th>Vence</th><th class="num">Cuota</th><th class="num">Abonado</th><th>Estado</th></tr></thead><tbody>' +
    cuotas.map(q => '<tr><td>' + q.n + '</td><td>' + fechaBonita(q.fecha) + '</td><td class="num">' + money(q.valor) + '</td><td class="num">' + money(q.pagado) + '</td><td>' + chipCuota(q, hoy) + (q.atraso ? ' <span class="small mut">+' + q.atraso + 'd</span>' : '') + '</td></tr>').join('') +
    '</tbody></table></div>';
}
</script>

<script>
let P = null, S = { monto: 0, meses: 0, frec: 'Semanal' }, consulta = null;

function redondearCuota(total, n) {
  // Cuota al valor más cercano (1.000 → 500 → 100 → 50); la última cuota completa el saldo exacto
  for (const r of [1000, 500, 100, 50]) {
    const cuota = Math.round(total / n / r) * r, ultima = total - cuota * (n - 1);
    if (cuota > 0 && ultima > 0 && ultima <= cuota * 2) return { cuota, ultima };
  }
  const cuota = Math.ceil(total / n); return { cuota, ultima: total - cuota * (n - 1) };
}
function calc(capital, meses, frec) {
  const n = Math.max(1, Math.round(meses * (P.porMes[frec] || 1)));
  const interes = Math.round(capital * P.tasa / 100 * meses), total = capital + interes;
  const { cuota, ultima } = redondearCuota(total, n);
  return { n, interes, total, cuota, ultima };
}
const etiqueta = { Diaria: 'diaria', Semanal: 'semanal', Quincenal: 'quincenal', Mensual: 'mensual' };

function ver(v) {
  $('#t1').className = v === 'sim' ? 'on' : ''; $('#t2').className = v === 'mi' ? 'on' : '';
  v === 'sim' ? pintarSim() : pintarMi();
}

function pintarSim() {
  const paso = P.montoMax > 2000000 ? 50000 : 10000;
  $('#app').innerHTML = `
  <div class="hero"><h1>Tu dinero, <em>sin vueltas</em>.</h1><p>Simula tu crédito y conoce tu cuota al instante.</p></div>
  <div class="card">
    <label>¿Cuánto necesitas?</label>
    <div class="mval" id="vm"></div>
    <input type="range" id="rm" min="${P.montoMin}" max="${P.montoMax}" step="${paso}" value="${S.monto}">
    <div class="row between small mut mt"><span>${money(P.montoMin)}</span><span>${money(P.montoMax)}</span></div>
    <label>Plazo</label>
    <select id="sm">${Array.from({ length: P.mesesMax - P.mesesMin + 1 }, (_, i) => P.mesesMin + i).map(m => `<option value="${m}" ${m == S.meses ? 'selected' : ''}>${m} ${m == 1 ? 'mes' : 'meses'}</option>`).join('')}</select>
    <label>¿Cada cuánto pagas?</label>
    <div class="pills" id="pf">${P.frecuencias.map(f => `<button data-f="${f}" class="${f === S.frec ? 'on' : ''}">${f}</button>`).join('')}</div>
    <div class="res" id="res"></div>
    <button class="btn full mt" onclick="formSolicitud()">Solicitar este crédito</button>
    <p class="small mut mt" style="text-align:center">Interés del ${P.tasa}% mensual sobre el capital · Sujeto a estudio de crédito</p>
  </div>
  <div class="steps"><div><b>1</b>Simula y envía tu solicitud</div><div><b>2</b>Analizamos y te llamamos</div><div><b>3</b>Recibe tu dinero</div></div>`;
  $('#rm').oninput = e => { S.monto = +e.target.value; actualizar(); };
  $('#sm').onchange = e => { S.meses = +e.target.value; actualizar(); };
  document.querySelectorAll('#pf button').forEach(b => b.onclick = () => { S.frec = b.dataset.f; document.querySelectorAll('#pf button').forEach(x => x.className = x === b ? 'on' : ''); actualizar(); });
  actualizar();
}

function actualizar() {
  const c = calc(S.monto, S.meses, S.frec);
  $('#vm').textContent = money(S.monto);
  $('#res').innerHTML = `<div class="small mut">Tu cuota ${etiqueta[S.frec]}</div><div class="big">${money(c.cuota)}</div>
    ${c.n > 1 && c.ultima !== c.cuota ? `<div class="small mut">${c.n - 1} cuotas de ${money(c.cuota)} + última de ${money(c.ultima)}</div>` : ''}
    <div class="k"><div>Cuotas<b>${c.n}</b></div><div>Interés<b>${money(c.interes)}</b></div><div>Total a pagar<b>${money(c.total)}</b></div></div>`;
}

function formSolicitud() {
  const c = calc(S.monto, S.meses, S.frec);
  modal(`<h2>Solicitud de crédito</h2><p class="mut small">${money(S.monto)} · ${S.meses} ${S.meses == 1 ? 'mes' : 'meses'} · cuota ${etiqueta[S.frec]} de ${money(c.cuota)}</p>
  <div class="grid g2 st">
    <div><label>Cédula *</label><input id="f_doc" inputmode="numeric"></div>
    <div><label>Nombre completo *</label><input id="f_nom"></div>
    <div><label>Celular / WhatsApp *</label><input id="f_tel" inputmode="tel"></div>
    <div><label>Correo electrónico *</label><input id="f_mail" type="email" inputmode="email" placeholder="tucorreo@ejemplo.com"></div>
    <div><label>Ocupación</label><input id="f_ocu" placeholder="Comerciante, empleado…"></div>
    <div><label>Dirección</label><input id="f_dir"></div>
    <div><label>Barrio</label><input id="f_bar"></div>
    <div><label>Referencia personal</label><input id="f_ref"></div>
    <div><label>Celular de la referencia</label><input id="f_tre" inputmode="tel"></div>
  </div>
  <p class="small mut mt">Si tu solicitud es preaprobada, te pediremos las fotos de tu cédula y la cuenta donde recibirás el dinero.</p>
  <label class="row" style="gap:8px;margin-top:14px"><input type="checkbox" id="f_ok" style="width:auto"> Autorizo el tratamiento de mis datos y la consulta de mi información para el estudio del crédito.</label>
  <button class="btn full mt" id="f_btn">Enviar solicitud</button>`);
  $('#f_btn').onclick = e => {
    if (!$('#f_ok').checked) return toast('Debes aceptar la autorización de datos', true);
    conBoton(e.currentTarget, async () => {
      const r = await api('enviarSolicitud', {
        documento: $('#f_doc').value, nombre: $('#f_nom').value.trim(), telefono: $('#f_tel').value, email: $('#f_mail').value.trim(),
        ocupacion: $('#f_ocu').value, direccion: $('#f_dir').value, barrio: $('#f_bar').value,
        referencia: $('#f_ref').value, telReferencia: $('#f_tre').value, monto: S.monto, meses: S.meses, frecuencia: S.frec
      });
      modal(`<div style="text-align:center;padding:20px 0">${GEM.replace('class="gem"', 'class="gem" style="width:64px;height:64px"')}
        <h2 class="mt">¡Solicitud recibida!</h2><p class="mut">Radicado <b style="color:var(--gold2)">${r.id}</b>. Nuestro analista revisará tu solicitud y te avisará por WhatsApp.</p>
        <p class="small mut mt">Si es <b>preaprobada</b>, entra a <b>Mi crédito</b> con tu cédula y los últimos 4 dígitos de tu celular para subir las fotos de tu cédula y la cuenta donde te consignamos.</p>
        <button class="btn mt" onclick="cerrarModal()">Entendido</button></div>`);
    });
  };
}

function pintarMi() {
  if (consulta) return pintarConsulta();
  $('#app').innerHTML = `<div class="card mt" style="max-width:420px;margin:30px auto">
    <h3>Consulta tu crédito</h3>
    <label>Cédula</label><input id="c_doc" inputmode="numeric">
    <label>Últimos 4 dígitos de tu celular</label><input id="c_tel" inputmode="numeric" maxlength="4" class="pin">
    <button class="btn full mt" id="c_btn">Consultar</button></div>`;
  $('#c_btn').onclick = e => conBoton(e.currentTarget, async () => {
    const r = await api('consultar', $('#c_doc').value, $('#c_tel').value);
    consulta = { doc: $('#c_doc').value, ult4: $('#c_tel').value, data: r };
    pintarConsulta();
  });
}

function pintarConsulta() {
  const d = consulta.data, hoy = hoyLocal();
  let h = `<div class="row between mb"><div><div class="mut small">Hola,</div><div class="serif" style="font-size:28px;font-weight:700">${esc(d.nombre)}</div></div>
    <button class="btn dark sm" onclick="consulta=null;pintarMi()">Salir</button></div>`;
  d.solicitudes.filter(s => s.estado === 'Preaprobada').forEach(s => {
    h += `<div class="card mb" style="border-color:var(--gold)"><div class="row between"><b style="font-size:16px">🎉 ¡Tu crédito fue preaprobado!</b><span class="chip c-gold">${s.id}</span></div>
      <div class="grid g3 mt small"><div><span class="mut">Monto</span><br><b style="font-size:18px">${money(s.monto)}</b></div>
      <div><span class="mut">Cuota ${FREC_TXT[s.frecuencia] || ''}</span><br><b style="font-size:18px">${s.cuota ? money(s.cuota) : '—'}</b></div>
      <div><span class="mut">Cuotas</span><br><b style="font-size:18px">${s.n || '—'}</b></div></div>
      ${s.respuesta ? `<p class="small mut mt">${esc(s.respuesta)}</p>` : ''}
      <p class="small mt">Para desembolsar necesitamos verificar tu identidad y saber a qué cuenta consignarte.</p>
      <button class="btn full mt" onclick="completarDocs('${s.id}')">Completar documentos</button></div>`;
  });
  const activos = d.creditos.filter(c => c.estado === 'Activo');
  if (!d.creditos.length) h += `<div class="card empty">Aún no tienes créditos desembolsados.</div>`;
  activos.concat(d.creditos.filter(c => c.estado !== 'Activo')).forEach(c => {
    h += `<div class="card mb">
      <div class="row between"><div><div class="small mut">${c.id} · ${c.frecuencia}</div><div style="font-weight:700">${money(c.capital)} a ${c.meses} ${c.meses == 1 ? 'mes' : 'meses'}</div></div>${chipSit(c.situacion, c.diasAtraso)}</div>
      ${c.estado === 'Activo' ? `
      <div class="grid g2 mt"><div><div class="small mut">Saldo pendiente</div><div class="big" style="font-size:32px">${money(c.saldo)}</div></div>
      <div><div class="small mut">${c.exigible > 0 ? 'Debes pagar hoy' : 'Próxima cuota'}</div><div style="font-size:22px;font-weight:700;margin-top:6px">${money(c.exigible > 0 ? c.exigible : (c.proxima ? c.proxima.valor : 0))}</div><div class="small mut">${c.proxima ? fechaBonita(c.proxima.fecha) : ''}</div></div></div>` : ''}
      <div class="row between small mut mt"><span>${c.cuotasPagadas} de ${c.numCuotas} cuotas</span><span>${c.avance}%</span></div>
      <div class="bar mt" style="margin-top:6px"><i style="width:${c.avance}%"></i></div>
      <div class="row mt">${c.estado === 'Activo' ? `<button class="btn sm" onclick="reportar('${c.id}')">Reportar pago</button>` : ''}
        <button class="btn ghost sm" onclick="plan('${c.id}')">Plan de pagos</button>${c.estado === 'Activo' ? `<button class="btn dark sm" onclick="refinanciar('${c.id}')">Refinanciar</button>` : ''}</div>
    </div>`;
  });
  if (d.solicitudes.length) {
    h += `<div class="card"><h3>Mis solicitudes</h3>` + d.solicitudes.map(s => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${s.tipo === 'Refinanciación' ? '<span class="chip c-refi">Refinanciación</span> ' : ''}<b>${money(s.monto)}</b> <span class="small mut">· ${s.meses}m · ${s.frecuencia} · ${s.fecha}</span>${s.respuesta && s.estado === 'Rechazada' ? `<div class="small mut">${esc(s.respuesta)}</div>` : ''}</div>
      <span class="chip ${s.estado === 'Aprobada' ? 'c-ok' : s.estado === 'Rechazada' ? 'c-bad' : s.estado === 'Preaprobada' ? 'c-gold' : 'c-warn'}">${({ Pendiente: 'En estudio', Preaprobada: 'Preaprobada', 'Documentos recibidos': 'Verificando documentos', Aprobada: 'Desembolsada' })[s.estado] || s.estado}</span></div>`).join('') + `</div>`;
  }
  $('#app').innerHTML = h;
}

function plan(id) {
  const c = consulta.data.creditos.find(x => x.id === id);
  modal(`<h2>Plan de pagos</h2><p class="mut small mb">${c.id} · Total ${money(c.total)} · Interés ${money(c.interes)}</p>${tablaCuotas(c.cuotas, hoyLocal())}
    ${c.pagos.length ? `<h3 class="mt" style="font-size:13px;color:var(--gold);letter-spacing:.12em">PAGOS</h3>` + c.pagos.map(p => `<div class="row between small" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${p.fecha} · ${esc(p.medio)}</span><span>${money(p.valor)} ${p.estado !== 'Aplicado' ? `<span class="chip ${p.estado === 'Rechazado' ? 'c-bad' : 'c-warn'}">${p.estado}</span>` : ''}</span></div>`).join('') : ''}`);
}

function refinanciar(id) {
  const c = consulta.data.creditos.find(x => x.id === id);
  const R = { meses: Math.min(P.refiMaxMeses, Math.max(2, c.meses)), frec: c.frecuencia, adic: 0 };
  modal(`<h2>Simular refinanciación</h2><p class="mut small">${c.id} · saldo ${money(c.saldo)} · cuota ${money(c.valorCuota)} ${FREC_TXT[c.frecuencia]}${c.diasAtraso ? ' · ' + c.diasAtraso + ' días de atraso' : ''}</p>
    <label>Nuevo plazo</label><select id="rf_m">${Array.from({ length: P.refiMaxMeses }, (_, i) => i + 1).map(m => `<option value="${m}" ${m == R.meses ? 'selected' : ''}>${m} ${m == 1 ? 'mes' : 'meses'}</option>`).join('')}</select>
    <label>¿Cada cuánto pagarías?</label><div class="pills" id="rf_f">${P.frecuencias.map(f => `<button data-f="${f}" class="${f === R.frec ? 'on' : ''}">${f}</button>`).join('')}</div>
    <div class="grid g2 st"><div><label>Dinero adicional (opcional)</label><input id="rf_a" inputmode="numeric" placeholder="$0"></div>
    <div><label>Tus ingresos mensuales hoy</label><input id="rf_i" inputmode="numeric" placeholder="$"></div></div>
    <div id="rf_res">${LOADING}</div>
    <label>¿Por qué necesitas refinanciar?</label><input id="rf_mo" placeholder="Ej: bajaron mis ventas este mes">
    <button class="btn full mt" id="rf_b">Solicitar refinanciación</button>
    <p class="small mut mt" style="text-align:center">La simulación no es una aprobación. Un analista revisará tu solicitud.</p>`);
  const fmtIn = e => { const n = e.target.value.replace(/\D/g, ''); e.target.value = n ? Number(n).toLocaleString('es-CO') : ''; };
  const sim = debounce(async () => {
    $('#rf_res').innerHTML = LOADING;
    try { const r = await api('clienteSimularRefi', consulta.doc, consulta.ult4, id, R.meses, R.frec, R.adic); $('#rf_res').innerHTML = refiHTML(r); }
    catch (e) { $('#rf_res').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
  }, 450);
  $('#rf_m').onchange = e => { R.meses = +e.target.value; sim(); };
  document.querySelectorAll('#rf_f button').forEach(b => b.onclick = () => { R.frec = b.dataset.f; document.querySelectorAll('#rf_f button').forEach(x => x.className = x === b ? 'on' : ''); sim(); });
  $('#rf_a').oninput = e => { fmtIn(e); R.adic = +e.target.value.replace(/\D/g, '') || 0; sim(); };
  $('#rf_i').oninput = fmtIn;
  $('#rf_b').onclick = e => conBoton(e.currentTarget, async () => {
    if (!$('#rf_i').value) throw new Error('Indica tus ingresos mensuales actuales');
    const r = await api('clienteSolicitarRefi', consulta.doc, consulta.ult4, id, R.meses, R.frec, R.adic, $('#rf_mo').value, $('#rf_i').value.replace(/\D/g, ''));
    consulta.data = await api('consultar', consulta.doc, consulta.ult4);
    modal(`<div style="text-align:center;padding:20px 0"><h2>Solicitud enviada</h2><p class="mut">Radicado <b style="color:var(--gold2)">${r.id}</b>. Revisaremos tu refinanciación y te contactaremos por WhatsApp. Mientras tanto tu crédito actual sigue vigente.</p><button class="btn mt" onclick="cerrarModal();pintarConsulta()">Entendido</button></div>`);
  });
  sim();
}

function completarDocs(solId) {
  modal(`<h2>Completa tu solicitud</h2><p class="mut small">Solicitud ${solId} · solo falta este paso para el desembolso.</p>
  <h3 class="mt" style="font-size:13px;color:var(--gold);letter-spacing:.12em">¿DÓNDE TE CONSIGNAMOS?</h3>
  <div class="grid g3 st">
    <div><label>Banco / billetera *</label><select id="f_ban"><option value="">Selecciona…</option>${['Nequi', 'Daviplata', 'Bancolombia', 'Davivienda', 'Banco de Bogotá', 'BBVA', 'Banco Caja Social', 'Nu', 'Banco Popular', 'Banco de Occidente', 'Otro'].map(b => `<option>${b}</option>`).join('')}</select></div>
    <div><label>Tipo *</label><select id="f_tip"><option>Billetera digital</option><option>Ahorros</option><option>Corriente</option></select></div>
    <div><label>Número de cuenta *</label><input id="f_cta" inputmode="numeric"></div>
  </div>
  <p class="small mut" style="margin-top:6px">La cuenta debe estar a tu nombre.</p>
  <h3 class="mt" style="font-size:13px;color:var(--gold);letter-spacing:.12em">VERIFICACIÓN DE IDENTIDAD</h3>
  <div class="docs">
    <label class="doc" id="d_frente"><input type="file" accept="image/*" data-k="frente"><span class="ph">🪪</span><b>Cédula · frente</b><small>Toca para subir foto</small></label>
    <label class="doc" id="d_reverso"><input type="file" accept="image/*" data-k="reverso"><span class="ph">🔄</span><b>Cédula · reverso</b><small>Toca para subir foto</small></label>
    <label class="doc" id="d_selfie"><input type="file" accept="image/*" data-k="selfie"><span class="ph">🤳</span><b>Selfie con tu cédula</b><small>Tu cara y la cédula visibles</small></label>
  </div>
  <label class="row" style="gap:8px;margin-top:14px"><input type="checkbox" id="k_ok" style="width:auto"> Confirmo que la cuenta está a mi nombre y que las fotos son auténticas.</label>
  <button class="btn full mt" id="k_btn">Enviar documentos</button>`);
  const DOCS = {};
  document.querySelectorAll('.doc input').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0], box = inp.parentElement;
    if (!f) return;
    try {
      DOCS[inp.dataset.k] = await comprimirImagen(f);
      box.classList.add('ok');
      box.querySelector('.ph').innerHTML = '<img src="data:image/jpeg;base64,' + DOCS[inp.dataset.k].data + '">';
      box.querySelector('small').textContent = 'Listo ✓ (toca para cambiar)';
    } catch (er) { toast(er.message, true); }
  });
  $('#k_btn').onclick = e => {
    if (!$('#f_ban').value || !$('#f_cta').value.trim()) return toast('Indica la cuenta donde recibirás el dinero', true);
    if (!DOCS.frente || !DOCS.reverso || !DOCS.selfie) return toast('Sube las fotos de tu cédula (frente y reverso) y la selfie', true);
    if (!$('#k_ok').checked) return toast('Confirma que la cuenta está a tu nombre', true);
    conBoton(e.currentTarget, async () => {
      await api('clienteEnviarDocumentos', consulta.doc, consulta.ult4, solId, { banco: $('#f_ban').value, tipoCuenta: $('#f_tip').value, numeroCuenta: $('#f_cta').value, docs: DOCS });
      consulta.data = await api('consultar', consulta.doc, consulta.ult4);
      modal(`<div style="text-align:center;padding:20px 0"><h2>¡Documentos recibidos!</h2><p class="mut">Estamos verificando tu identidad. Cuando hagamos el desembolso te avisaremos por WhatsApp.</p><button class="btn mt" onclick="cerrarModal();pintarConsulta()">Entendido</button></div>`);
    });
  };
}

function reportar(id) {
  const c = consulta.data.creditos.find(x => x.id === id);
  const sug = c.exigible > 0 ? c.exigible : (c.proxima ? c.proxima.valor : 0);
  modal(`<h2>Reportar pago</h2><p class="mut small">Paga por transferencia y sube tu comprobante. Lo verificamos y se aplica a tu crédito.</p>
    <div class="card mt" style="padding:14px"><div class="small mut">Medios de pago</div><div style="font-weight:600;margin-top:4px">${esc(P.mediosPago)}</div></div>
    <label>Valor pagado</label><input id="r_val" inputmode="numeric" value="${Number(sug).toLocaleString('es-CO')}">
    <label>Referencia / número de transacción</label><input id="r_ref">
    <label>Comprobante (foto)</label><input type="file" id="r_file" accept="image/*,application/pdf">
    <button class="btn full mt" id="r_btn">Enviar</button>`);
  $('#r_val').oninput = e => { const n = e.target.value.replace(/\D/g, ''); e.target.value = n ? Number(n).toLocaleString('es-CO') : ''; };
  $('#r_btn').onclick = e => conBoton(e.currentTarget, async () => {
    const f = $('#r_file').files[0];
    if (!f) throw new Error('Adjunta el comprobante');
    if (f.size > 8e6) throw new Error('El archivo es muy pesado (máx 8 MB)');
    const data = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
    await api('reportarPago', consulta.doc, consulta.ult4, id, $('#r_val').value.replace(/\D/g, ''), $('#r_ref').value, { name: f.name, mime: f.type, data });
    consulta.data = await api('consultar', consulta.doc, consulta.ult4);
    cerrarModal(); pintarConsulta(); toast('Pago reportado. Lo verificaremos pronto.');
  });
}

(async () => {
  $('#app').innerHTML = LOADING;
  try {
    P = await api('getPublico');
    $('#brand').innerHTML = brandHTML(P.nombre, P.eslogan);
    $('#fab').href = wa(P.whatsapp, 'Hola, quiero información sobre un crédito');
    S.monto = Math.round((P.montoMin + (P.montoMax - P.montoMin) * 0.2) / 50000) * 50000 || P.montoMin;
    S.meses = Math.min(P.mesesMax, Math.max(P.mesesMin, 3));
    pintarSim();
  } catch (e) { $('#app').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
})();
</script>
</body>
</html>
